services:
  - type: web
    name: strokeguard-ai
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt && python ml/train_model.py"
    startCommand: "gunicorn run:app -c gunicorn.conf.py"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///health_monitor.db
