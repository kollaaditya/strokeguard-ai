{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-page d-flex align-items-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7">
        <div class="card auth-card shadow-lg border-0">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <i class="fas fa-user-plus text-primary fa-3x mb-3"></i>
              <h3 class="fw-bold">Create Account</h3>
              <p class="text-muted">Join StrokeGuard AI for free health monitoring</p>
            </div>

            <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                  <input type="text" name="username" class="form-control" placeholder="Choose a username" required minlength="3"/>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Full Name</label>
                  <input type="text" name="full_name" class="form-control" placeholder="Your full name"/>
                </div>
                <div class="col-12">
                  <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                  <input type="email" name="email" class="form-control" placeholder="your@email.com" required/>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                  <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required minlength="6"/>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
                  <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required/>
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-semibold">Age</label>
                  <input type="number" name="age" class="form-control" placeholder="Your age" min="1" max="120"/>
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-semibold">Gender</label>
                  <select name="gender" class="form-select">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label fw-semibold">Emergency Contact</label>
                  <input type="tel" name="emergency_contact" class="form-control" placeholder="+91XXXXXXXXXX"/>
                </div>
              </div>

              <div class="mt-4">
                <button type="submit" class="btn btn-primary w-100 btn-lg fw-semibold">
                  <i class="fas fa-user-plus me-2"></i>Create Account
                </button>
              </div>
            </form>

            <hr class="my-4"/>
            <p class="text-center text-muted mb-0">
              Already have an account?
              <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold">Login here</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
