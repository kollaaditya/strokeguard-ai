{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-page d-flex align-items-center min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card auth-card shadow-lg border-0">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <i class="fas fa-heartbeat text-danger fa-3x mb-3"></i>
              <h3 class="fw-bold">Welcome Back</h3>
              <p class="text-muted">Sign in to your StrokeGuard account</p>
            </div>

            <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
              <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
                  <input type="text" name="username" class="form-control" placeholder="Enter username" required/>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                  <input type="password" name="password" id="passwordField" class="form-control" placeholder="Enter password" required/>
                  <button class="btn btn-outline-secondary" type="button" onclick="togglePwd()">
                    <i class="fas fa-eye" id="eyeIcon"></i>
                  </button>
                </div>
              </div>

              <div class="mb-4 d-flex justify-content-between align-items-center">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" name="remember" id="remember"/>
                  <label class="form-check-label text-muted" for="remember">Remember me</label>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100 btn-lg fw-semibold">
                <i class="fas fa-sign-in-alt me-2"></i>Login
              </button>
            </form>

            <hr class="my-4"/>
            <p class="text-center text-muted mb-0">
              Don't have an account?
              <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold">Register here</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePwd() {
  const f = document.getElementById('passwordField');
  const i = document.getElementById('eyeIcon');
  f.type = f.type === 'password' ? 'text' : 'password';
  i.className = f.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
}
</script>
{% endblock %}
